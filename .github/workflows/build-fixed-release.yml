name: Build TypingWatch Fixed Release

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/TypingWatch_Complete_Online.cs'
      - 'version.json'
      - '.github/workflows/build-fixed-release.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch source for online features
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $source='src\TypingWatch_Complete_Online.cs'
          $build='TypingWatch_Build.cs'
          $utf8=New-Object System.Text.UTF8Encoding($false)
          $text=[System.IO.File]::ReadAllText($source,$utf8)

          $text=$text.Replace('const string AppVersion = "1.0.10";','const string AppVersion = "1.0.11";')
          $text=$text.Replace('onlineUsersLabel.Visible=false;','onlineUsersLabel.Visible=true;')

          $old='string api="https://raw.githubusercontent.com/"+UpdateOwner+"/"+UpdateRepository+"/main/version.json";'
          $new='string api=OnlineServerUrl+"?action=config&_="+DateTime.UtcNow.Ticks;'
          $text=$text.Replace($old,$new)

          $oldDownload='string url="https://raw.githubusercontent.com/"+UpdateOwner+"/"+UpdateRepository+"/main/TypingWatch.exe";'
          $newDownload='string url="https://github.com/"+UpdateOwner+"/"+UpdateRepository+"/raw/refs/heads/main/TypingWatch.exe";'
          $text=$text.Replace($oldDownload,$newDownload)

          $startupPattern='BeginInvoke\(\(MethodInvoker\)delegate\s*\{\s*StartOnlineSync\(\);\s*CheckForUpdates\(false\);\s*\}\);'
          $startupReplacement='Shown+=(s,e)=>{ StartOnlineSync(); CheckForUpdates(false); };'
          $text=[regex]::Replace($text,$startupPattern,$startupReplacement,1)

          [System.IO.File]::WriteAllText($build,$text,$utf8)

          $startupCode=@'
using System;
using System.IO;
using System.Reflection;
using System.Windows.Forms;
class Startup
{
    [STAThread]
    static void Main()
    {
        Application.EnableVisualStyles();
        Application.SetCompatibleTextRenderingDefault(false);
        try
        {
            Type appType=typeof(TypingWatch);
            ConstructorInfo ctor=appType.GetConstructor(BindingFlags.Instance|BindingFlags.Public|BindingFlags.NonPublic,null,Type.EmptyTypes,null);
            if(ctor==null) throw new MissingMethodException("TypingWatch parameterless constructor was not found.");
            Form app=(Form)ctor.Invoke(null);
            Application.Run(app);
        }
        catch(Exception ex)
        {
            Exception root=ex is TargetInvocationException && ex.InnerException!=null ? ex.InnerException : ex;
            try
            {
                string folder=Path.Combine(Environment.GetFolderPath(Environment.SpecialFolder.ApplicationData),"TypingWatch");
                Directory.CreateDirectory(folder);
                File.WriteAllText(Path.Combine(folder,"startup-crash.log"),DateTime.Now.ToString("o")+Environment.NewLine+root.ToString());
            } catch { }
            throw;
        }
    }
}
'@
          [System.IO.File]::WriteAllText('src\Startup.cs',$startupCode,$utf8)

      - name: Compile x86 EXE
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $csc=Join-Path $env:WINDIR 'Microsoft.NET\Framework\v4.0.30319\csc.exe'
          if(-not (Test-Path $csc)) { throw 'x86 C# compiler not found.' }
          & $csc /nologo /target:winexe /platform:x86 /main:Startup /optimize+ /out:TypingWatch.exe /reference:System.dll /reference:System.Core.dll /reference:System.Drawing.dll /reference:System.Windows.Forms.dll src\TypingWatch_Build.cs src\Startup.cs
          if($LASTEXITCODE -ne 0) { throw 'C# compilation failed.' }
          if(-not (Test-Path 'TypingWatch.exe')) { throw 'TypingWatch.exe was not created.' }
          if((Get-Item 'TypingWatch.exe').Length -lt 30000) { throw 'EXE is unexpectedly small.' }

      - name: Startup smoke test
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p=Start-Process -FilePath (Join-Path $env:GITHUB_WORKSPACE 'TypingWatch.exe') -PassThru
          Start-Sleep -Seconds 10
          if($p.HasExited) { throw "TypingWatch exited during startup test. ExitCode=$($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force

      - name: Publish EXE
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TypingWatch.exe
          if(-not (git diff --cached --quiet)) {
            git commit -m 'Publish fixed TypingWatch EXE 1.0.11 [skip ci]'
            git push
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TypingWatch-1.0.11-fixed-x86
          path: TypingWatch.exe
          if-no-files-found: error
