name: Validate Typing Watch integration

on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/Code.gs'
      - 'admin.html'
      - 'src/TypingWatch_Complete_Online.cs'
      - 'version.json'
      - '.github/workflows/validate-integration.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate Apps Script syntax
        run: |
          cp backend/Code.gs /tmp/typingwatch-backend.js
          node --check /tmp/typingwatch-backend.js
      - name: Validate Admin Panel JavaScript
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path('admin.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', html, re.I | re.S)
          if not scripts:
              raise SystemExit('No inline admin scripts found')
          for i, script in enumerate(scripts):
              Path(f'/tmp/admin-{i}.js').write_text(script, encoding='utf-8')
          PY
          for file in /tmp/admin-*.js; do node --check "$file"; done
      - name: Check shared endpoint and action contracts
        run: |
          node <<'NODE'
          const fs = require('fs');
          const backend = fs.readFileSync('backend/Code.gs', 'utf8');
          const admin = fs.readFileSync('admin.html', 'utf8');
          const app = fs.readFileSync('src/TypingWatch_Complete_Online.cs', 'utf8');
          const index = fs.readFileSync('index.html', 'utf8');
          const versionJson = JSON.parse(fs.readFileSync('version.json', 'utf8'));
          const versionTxt = fs.readFileSync('version.txt', 'utf8').trim();
          const appVersion = (app.match(/AppVersion = "([^"]+)"/) || [])[1] || '';
          const urls = [app, admin, index].flatMap(s => s.match(/https:\/\/script\.google\.com\/macros\/s\/[^"' ]+\/exec/g) || []);
          const checks = [
            ['backend health route', /action === 'health'/.test(backend)],
            ['backend heartbeat route', /action === 'heartbeat'/.test(backend)],
            ['backend stats route', /action === 'stats'/.test(backend) && backend.includes('function statsPublic_(')],
            ['private records require admin authentication', /Admin authentication required/.test(backend) && /op==='list_licenses'/.test(backend) && /op==='list_downloads'/.test(backend) && /op==='stats'/.test(backend) && backend.includes('delete stats.users')],
            ['backend config route', /action === 'config'/.test(backend)],
            ['backend chat routes', /action === 'chat'/.test(backend) && /action === 'chatsend'/.test(backend)],
            ['backend app catalog functions', /function appsPublic_\(/.test(backend) && /function appsAdmin_\(/.test(backend)],
            ['backend website content functions', /function websiteContent_\(/.test(backend) && /function saveWebsiteContent_\(/.test(backend)],
            ['Apps sheet is initialized', /APPS: 'Apps'/.test(backend) && /SHEETS\.APPS/.test(backend)],
            ['admin reads backend stats and config', /read\('stats'\)/.test(admin) && /read\('config'\)/.test(admin)],
            ['admin writes use protected admin operation', /action:'admin'/.test(admin) && /token:k/.test(admin) && /adminKey:k/.test(admin)],
            ['admin exposes app catalog editor', /Website App Catalog/.test(admin) && /apps_save/.test(admin)],
            ['admin exposes website content editor', /Website Content/.test(admin) && /website_content/.test(admin)],
            ['desktop app has heartbeat integration', /heartbeat/.test(app)],
            ['desktop app reads stats', /\?action=stats/.test(app)],
            ['desktop app reads config', /\?action=config/.test(app)],
            ['version files are aligned', versionJson.tag_name === versionTxt && versionTxt === appVersion],
            ['all components share one backend URL', urls.length >= 3 && new Set(urls).size === 1]
          ];
          for (const [name, ok] of checks) {
            console.log((ok ? 'PASS ' : 'FAIL ') + name);
            if (!ok) process.exitCode = 1;
          }
          NODE
