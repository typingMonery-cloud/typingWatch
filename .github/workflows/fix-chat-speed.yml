name: Fix Live Chat delivery speed

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-chat:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and normalize Live Chat refresh interval
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = 'src\TypingWatch_Complete_Online.cs'
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          $text = [System.IO.File]::ReadAllText($source,$utf8)
          $text = $text.Replace('refreshTimer.Interval=5000;', 'refreshTimer.Interval=1000;')
          [System.IO.File]::WriteAllText($source,$text,$utf8)
          $copy = Join-Path $env:TEMP 'TypingWatchBackendCheck.js'
          [System.IO.File]::Copy('backend\Code.gs',$copy,$true)
          node --check $copy
          if ($LASTEXITCODE -ne 0) { throw 'Backend JavaScript syntax check failed.' }

      - name: Commit changes if needed
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add src\TypingWatch_Complete_Online.cs
          if (-not (git diff --cached --quiet)) {
            git commit -m "Normalize TypingWatch Live Chat refresh interval [skip ci]"
            git fetch origin $env:GITHUB_REF_NAME
            git rebase origin/$env:GITHUB_REF_NAME
            git push origin HEAD:$env:GITHUB_REF_NAME
          }
