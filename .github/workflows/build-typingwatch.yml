name: Build Typing Watch (Clean Known-Good Test)

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/TypingWatch_Complete_Online.cs'
      - 'src/Startup.cs'
      - '.github/workflows/build-typingwatch.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out known-good source
        uses: actions/checkout@v4

      - name: Compile Windows 7 x86 app
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'src\TypingWatch_Complete_Online.cs'
          $startup = Join-Path $env:GITHUB_WORKSPACE 'src\Startup.cs'
          $outDir = Join-Path $env:GITHUB_WORKSPACE 'dist'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          if (-not (Test-Path $source)) { throw 'Source C# file was not found.' }
          if (-not (Test-Path $startup)) { throw 'Startup.cs was not found.' }

          $utf8 = New-Object System.Text.UTF8Encoding($false)
          $code = [System.IO.File]::ReadAllText($source,$utf8)

          # Use the current deployed backend without changing the protected source branch.
          $code = $code.Replace('https://script.google.com/macros/s/AKfycbxqCie36dJeZXBTRDsFMDhFYE0vZHnhXFdH1laGqTLScO-IPTlqZJ9IOotb91oJfR2QUA/exec','https://script.google.com/macros/s/AKfycbwYC3hYVzLUrlbxhpDezC9fMt7748v7hN_u2SmF5vzN3XeocI7NCeHNIdeE2X0yFZECNw/exec')
          $code = $code.Replace('const string AppVersion = "1.0.0";','const string AppVersion = "1.0.4";')
          $code = $code.Replace('const string AppVersion = "1.0.2";','const string AppVersion = "1.0.4";')
          $code = $code.Replace('const string AppVersion = "1.0.3";','const string AppVersion = "1.0.4";')
          $code = $code.Replace('nextOnlineSync=DateTime.Now.AddSeconds(30);','nextOnlineSync=DateTime.Now.AddSeconds(5);')
          $code = $code.Replace('nextOnlineSync=DateTime.Now.AddSeconds(5);','nextOnlineSync=DateTime.Now.AddSeconds(5);')

          # Move online startup work until the WinForms message loop is ready.
          $old = '        BeginInvoke((MethodInvoker)delegate { StartOnlineSync(); CheckForUpdates(false); });'
          $new = '        Shown += (s,e) => { StartOnlineSync(); CheckForUpdates(false); };'
          if ($code.Contains($old)) { $code = $code.Replace($old,$new) }

          # Never show the old disconnected-GitHub placeholder message.
          $code = $code.Replace('if(UpdateOwner=="YOUR-GITHUB-USERNAME")','if(false)')

          [System.IO.File]::WriteAllText($source,$code,$utf8)

          $compiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework\v4.0.30319\csc.exe'
          if (-not (Test-Path $compiler)) { $compiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe' }
          if (-not (Test-Path $compiler)) { throw 'C# compiler csc.exe not found on runner.' }

          & $compiler /nologo /target:winexe /platform:x86 /main:Startup /optimize+ /out:"$outDir\TypingWatch.exe" /reference:System.dll /reference:System.Core.dll /reference:System.Drawing.dll /reference:System.Windows.Forms.dll "$source" "$startup"
          if ($LASTEXITCODE -ne 0) { throw "C# compilation failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "$outDir\TypingWatch.exe")) { throw 'Compilation did not produce TypingWatch.exe.' }
          $size = (Get-Item "$outDir\TypingWatch.exe").Length
          if ($size -lt 30000) { throw "Built EXE is unexpectedly small: $size bytes" }
          Write-Host "Built TypingWatch.exe size: $size bytes"

      - name: Runtime smoke test with diagnostics
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:GITHUB_WORKSPACE 'dist\TypingWatch.exe'
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) {
            Write-Host "TypingWatch.exe exited during startup. ExitCode=$($p.ExitCode)"
            Write-Host '===== STARTUP CRASH LOG ====='
            $crashLog = Join-Path ([Environment]::GetFolderPath('ApplicationData')) 'TypingWatch\startup-crash.log'
            if (Test-Path $crashLog) { Get-Content $crashLog | Write-Host } else { Write-Host 'startup-crash.log was not created.' }
            Write-Host '===== .NET RUNTIME EVENTS ====='
            Get-WinEvent -FilterHashtable @{LogName='Application'; ProviderName='.NET Runtime'; StartTime=(Get-Date).AddMinutes(-2)} -ErrorAction SilentlyContinue | Select-Object -First 10 TimeCreated,Id,Message | Format-List | Out-String -Width 500 | Write-Host
            Write-Host '===== APPLICATION ERROR EVENTS ====='
            Get-WinEvent -FilterHashtable @{LogName='Application'; ProviderName='Application Error'; StartTime=(Get-Date).AddMinutes(-2)} -ErrorAction SilentlyContinue | Select-Object -First 10 TimeCreated,Id,Message | Format-List | Out-String -Width 500 | Write-Host
            throw "TypingWatch.exe exited during startup smoke test. ExitCode=$($p.ExitCode)"
          }
          Write-Host 'STARTUP SMOKE TEST PASSED: process stayed alive for 10 seconds.'
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue

      - name: Upload verified test artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TypingWatch-Clean-KnownGood-x86
          path: dist/TypingWatch.exe
          if-no-files-found: error
