name: Package Typing Watch EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'TypingWatch.exe'
      - 'src/TypingWatch_Complete_Online.cs'
      - '.github/workflows/build-typingwatch.yml'
      - 'version.json'

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build stable online-sync EXE
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'src\TypingWatch_Complete_Online.cs'
          $patched = Join-Path $env:GITHUB_WORKSPACE 'src\TypingWatch_Complete_Online_Build.cs'
          if (-not (Test-Path $source)) { throw 'Source C# file was not found.' }

          # Keep the known-good parent source as the build base so the existing
          # Hindi/English, Online Users, Announcement, License, Live Chat,
          # typing totals and UI behavior are not replaced by a new app.
          git checkout HEAD^ -- src/TypingWatch_Complete_Online.cs

          $utf8 = New-Object System.Text.UTF8Encoding($false)
          $text = [System.IO.File]::ReadAllText($source, $utf8)

          # Preserve the existing working online-sync behavior.
          $text = $text.Replace('const string AppVersion = "1.0.0";', 'const string AppVersion = "1.0.4";')
          $text = $text.Replace('const string AppVersion = "1.0.2";', 'const string AppVersion = "1.0.4";')
          $text = $text.Replace('const string AppVersion = "1.0.3";', 'const string AppVersion = "1.0.4";')
          $text = $text.Replace('if(DateTime.Now>=nextOnlineSync) { nextOnlineSync=DateTime.Now.AddSeconds(30); SyncOnlineNow(); }', 'if(DateTime.Now>=nextOnlineSync) { nextOnlineSync=DateTime.Now.AddSeconds(5); SyncOnlineNow(); }')
          $text = $text.Replace('nextOnlineSync=DateTime.Now.AddSeconds(30);', 'nextOnlineSync=DateTime.Now.AddSeconds(5);')

          # Remove the obsolete placeholder-owner guard without changing the
          # actual repository constants used by the updater.
          $text = [regex]::Replace($text, 'if\(UpdateOwner==\s*"YOUR-GITHUB-USERNAME"\)', 'if(false)', 1)

          # Keep the known-good heartbeat payload shape.
          $newPayload = '                    string payload="{\"action\":\"heartbeat\",\"userId\":\""+onlineUserId+"\",\"typing\":\""+(typing?"true":"false")+"\",\"language\":\""+language+"\",\"wpm\":"+((int)Math.Round(displayedWpm))+",\"version\":\""+AppVersion+"\"}";'
          $text = [regex]::Replace($text, '(?m)^\s*string payload=.*heartbeat.*$', $newPayload)

          # Replace only the Auto Update method. It first checks version.json;
          # when a newer version exists, the user can download/install the new
          # EXE from the same permanent GitHub repository. No other app feature
          # is changed.
          $updateMethod = @'
    void CheckForUpdates(bool manual)
    {
        if(updateCheckRunning)
            return;

        updateCheckRunning=true;
        updateButton.Enabled=false;

        ThreadPool.QueueUserWorkItem(
            delegate
            {
                try
                {
                    ServicePointManager.SecurityProtocol=SecurityProtocolType.Tls12;

                    string api=
                        "https://raw.githubusercontent.com/"+
                        UpdateOwner+
                        "/"+
                        UpdateRepository+
                        "/main/version.json";

                    string json;

                    using(WebClient wc=new WebClient())
                    {
                        wc.Headers[HttpRequestHeader.UserAgent]="TypingWatch/"+AppVersion;
                        json=wc.DownloadString(api);
                    }

                    string tag=ExtractJsonValue(json,"tag_name");
                    if(String.IsNullOrEmpty(tag))
                        tag=ExtractJsonValue(json,"version");

                    bool newer=IsNewerVersion(tag,AppVersion);

                    BeginInvoke((MethodInvoker)delegate
                    {
                        updateCheckRunning=false;
                        updateButton.Enabled=true;

                        if(newer)
                        {
                            DialogResult dr=MessageBox.Show(
                                "New Typing Watch version available: "+tag+
                                "\r\nCurrent: "+AppVersion+
                                "\r\n\r\nDownload and install the new version?",
                                "Update Available",
                                MessageBoxButtons.YesNo,
                                MessageBoxIcon.Information);

                            if(dr==DialogResult.Yes)
                                StartSelfUpdate(tag);
                        }
                        else if(manual)
                        {
                            MessageBox.Show(
                                "Latest version installed hai ("+AppVersion+").",
                                "Typing Watch",
                                MessageBoxButtons.OK,
                                MessageBoxIcon.Information);
                        }
                    });
                }
                catch(Exception ex)
                {
                    BeginInvoke((MethodInvoker)delegate
                    {
                        updateCheckRunning=false;
                        updateButton.Enabled=true;

                        if(manual)
                        {
                            MessageBox.Show(
                                "Update check failed.\r\n\r\n"+ex.Message,
                                "Typing Watch",
                                MessageBoxButtons.OK,
                                MessageBoxIcon.Warning);
                        }
                    });
                }
            });
    }

    void StartSelfUpdate(string latestVersion)
    {
        try
        {
            string currentExe=Application.ExecutablePath;
            string tempExe=Path.Combine(
                Path.GetTempPath(),
                "TypingWatch-update-"+Guid.NewGuid().ToString("N")+".exe");
            string script=Path.Combine(
                Path.GetTempPath(),
                "TypingWatch-update-"+Guid.NewGuid().ToString("N")+".cmd");

            string downloadUrl=
                "https://raw.githubusercontent.com/"+
                UpdateOwner+
                "/"+
                UpdateRepository+
                "/main/TypingWatch.exe";

            using(WebClient wc=new WebClient())
            {
                wc.Headers[HttpRequestHeader.UserAgent]="TypingWatch/"+AppVersion;
                wc.DownloadFile(downloadUrl,tempExe);
            }

            if(!File.Exists(tempExe) || new FileInfo(tempExe).Length<=0)
                throw new Exception("New TypingWatch.exe download nahi hua.");

            string scriptText=
                "@echo off\r\n"+
                "setlocal\r\n"+
                "set NEW=\""+tempExe+"\"\r\n"+
                "set OLD=\""+currentExe+"\"\r\n"+
                "timeout /t 2 /nobreak >nul\r\n"+
                "set /a N=0\r\n"+
                ":retry\r\n"+
                "copy /Y %NEW% %OLD% >nul 2>&1\r\n"+
                "if not errorlevel 1 goto startapp\r\n"+
                "set /a N=N+1\r\n"+
                "if %N% GEQ 20 goto fail\r\n"+
                "timeout /t 1 /nobreak >nul\r\n"+
                "goto retry\r\n"+
                ":startapp\r\n"+
                "del %NEW% >nul 2>&1\r\n"+
                "start \"\" %OLD%\r\n"+
                "del \"%~f0\" >nul 2>&1\r\n"+
                "exit /b 0\r\n"+
                ":fail\r\n"+
                "del %NEW% >nul 2>&1\r\n"+
                "del \"%~f0\" >nul 2>&1\r\n"+
                "exit /b 1\r\n";

            File.WriteAllText(script,scriptText,Encoding.ASCII);

            Process.Start(new ProcessStartInfo(script)
            {
                UseShellExecute=true,
                WindowStyle=ProcessWindowStyle.Hidden
            });

            Application.Exit();
        }
        catch(Exception ex)
        {
            MessageBox.Show(
                "Update download/install failed.\r\n\r\n"+ex.Message,
                "Typing Watch",
                MessageBoxButtons.OK,
                MessageBoxIcon.Warning);
        }
    }

'@

          $pattern = '(?s)    void CheckForUpdates\(bool manual\).*?\n    string ExtractJsonValue\('
          if (-not [regex]::IsMatch($text, $pattern)) {
            throw 'Could not locate the existing CheckForUpdates method.'
          }
          $text = [regex]::Replace($text, $pattern, $updateMethod + '    string ExtractJsonValue(', 1)

          [System.IO.File]::WriteAllText($source, $text, $utf8)
          [System.IO.File]::WriteAllText($patched, $text, $utf8)

          # Publish the matching public version marker used by the updater.
          [System.IO.File]::WriteAllText(
            (Join-Path $env:GITHUB_WORKSPACE 'version.json'),
            '{"tag_name":"1.0.4"}' + [Environment]::NewLine,
            $utf8)

          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path $csc)) { $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework\v4.0.30319\csc.exe' }
          if (-not (Test-Path $csc)) { throw 'C# compiler was not found.' }
          & $csc /nologo /target:winexe /out:TypingWatch.exe /reference:System.dll /reference:System.Core.dll /reference:System.Drawing.dll /reference:System.Windows.Forms.dll $patched
          if ($LASTEXITCODE -ne 0) { throw 'C# compilation failed.' }
          if (-not (Test-Path 'TypingWatch.exe')) { throw 'TypingWatch.exe was not created.' }
          if ((Get-Item 'TypingWatch.exe').Length -le 0) { throw 'Built EXE is empty.' }

      - name: Prepare artifact
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $outDir = Join-Path $env:GITHUB_WORKSPACE 'dist'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'TypingWatch.exe') -Destination (Join-Path $outDir 'TypingWatch.exe') -Force

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: TypingWatch-Windows-EXE
          path: dist/TypingWatch.exe
          if-no-files-found: error

      - name: Commit fixed source, version and EXE
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/TypingWatch_Complete_Online.cs TypingWatch.exe version.json
          if (-not (git diff --cached --quiet)) {
            git commit -m "Fix TypingWatch auto-update and publish v1.0.4 [skip ci]"
            git push
          }
