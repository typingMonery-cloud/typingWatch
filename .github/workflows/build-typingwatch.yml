name: Package Typing Watch EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'TypingWatch.exe'
      - 'src/TypingWatch_Complete_Online.cs'
      - '.github/workflows/build-typingwatch.yml'
      - 'version.json'

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch source for fixed release
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'src\TypingWatch_Complete_Online.cs'
          $build = Join-Path $env:GITHUB_WORKSPACE 'TypingWatch_Build.cs'
          $backend = Join-Path $env:GITHUB_WORKSPACE 'backend\Code.gs'
          if (-not (Test-Path $source)) { throw 'Source C# file was not found.' }
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          $text = [System.IO.File]::ReadAllText($source,$utf8)

          # Permanent target: 100 hours.
          $text = [regex]::Replace($text,'TimeSpan\.FromHours\(50\)','TimeSpan.FromHours(100)')
          $text = [regex]::Replace($text,'Remaining \(50h\):','Remaining (100h):')

          # Clean labels.
          $text = [regex]::Replace($text,'(?m)(dashboardButton\.Text=\s*)".*?(Settings Dashboard)";','$1"$2";')
          $text = [regex]::Replace($text,'(?m)(chatButton\.Text=\s*)".*?(Live Chat)";','$1"$2";')
          $text = [regex]::Replace($text,'(?m)(updateButton\.Text=\s*)".*?(Check for Updates)";','$1"$2";')

          # Fix the broken heading without depending on its encoded symbol.
          $text = [regex]::Replace($text,'(?m)"[^"]*TYPING WATCH','"TYPING WATCH',1)

          # Convert accidental double-escaped line breaks back to normal C# escapes.
          $text = $text.Replace('\\\\r\\\\n','\\r\\n')

          # The check mark must be one C# Unicode escape, not a literal backslash sequence.
          $text = $text.Replace('\\\\u2713','\\u2713')

          # Keep the status block top-to-bottom and readable.
          $text = $text.Replace('label.TextAlign=\n            ContentAlignment.MiddleCenter;', 'label.TextAlign=\n            ContentAlignment.TopCenter;')

          $text = $text.Replace('const string AppVersion = "1.0.10";','const string AppVersion = "1.0.13";')
          $text = $text.Replace('const string AppVersion = "1.0.11";','const string AppVersion = "1.0.13";')
          $text = $text.Replace('const string AppVersion = "1.0.12";','const string AppVersion = "1.0.13";')
          $text = $text.Replace('onlineUsersLabel.Visible=false;','onlineUsersLabel.Visible=true;')

          $old = 'string api="https://raw.githubusercontent.com/"+UpdateOwner+"/"+UpdateRepository+"/main/version.json";'
          $new = 'string api=OnlineServerUrl+"?action=config&_="+DateTime.UtcNow.Ticks;'
          $text = $text.Replace($old,$new)

          $oldDownload = 'string url="https://raw.githubusercontent.com/"+UpdateOwner+"/"+UpdateRepository+"/main/TypingWatch.exe";'
          $newDownload = 'string url="https://github.com/"+UpdateOwner+"/"+UpdateRepository+"/raw/refs/heads/main/TypingWatch.exe";'
          $text = $text.Replace($oldDownload,$newDownload)

          $startupPattern = 'BeginInvoke\(\(MethodInvoker\)delegate\s*\{\s*StartOnlineSync\(\);\s*CheckForUpdates\(false\);\s*\}\);'
          $startupReplacement = 'Shown+=(s,e)=>{ StartOnlineSync(); CheckForUpdates(false); };'
          $text = [regex]::Replace($text,$startupPattern,$startupReplacement,1)

          # Live Chat fix: show the sender's message immediately, keep it while a server
          # response is pending, and refresh from the shared server after a successful send.
          $chatFields = '    bool busy=false;'
          $chatFieldsReplacement = @'
    bool busy=false;
    string pendingMessage="";
    string pendingRendered="";
'@
          $text = $text.Replace($chatFields,$chatFieldsReplacement.TrimEnd())

          $loadPattern = '(?s)    void LoadMessages\(\)\s*\{.*?\n    \}\n\n    void SendMessage'
          $loadReplacement = @'
    void LoadMessages()
    {
        if(busy)return;
        busy=true;
        ThreadPool.QueueUserWorkItem(delegate
        {
            string text="";
            try
            {
                ServicePointManager.SecurityProtocol=SecurityProtocolType.Tls12;
                using(WebClient wc=new WebClient())
                {
                    wc.Headers[HttpRequestHeader.UserAgent]="TypingWatch/"+Environment.Version.ToString();
                    wc.CachePolicy=new System.Net.Cache.RequestCachePolicy(System.Net.Cache.RequestCacheLevel.NoCacheNoStore);
                    text=wc.DownloadString(serverUrl+"?action=chat&_="+DateTime.UtcNow.Ticks);
                }
            }
            catch {}
            BeginInvoke((MethodInvoker)delegate
            {
                busy=false;
                if(String.IsNullOrEmpty(text))return;
                string data=ExtractChatValue(text,"messages");
                if(String.IsNullOrEmpty(data))return;
                messages.Items.Clear();
                string[] rows=data.Split(new char[]{'\n'},StringSplitOptions.RemoveEmptyEntries);
                bool pendingFound=false;
                foreach(string row in rows)
                {
                    string[] p=row.Split(new string[]{"|||"},3,StringSplitOptions.None);
                    if(p.Length==3)
                    {
                        string rendered=p[0]+"  "+p[1]+": "+p[2];
                        messages.Items.Add(rendered);
                        if(!String.IsNullOrEmpty(pendingRendered) && rendered.EndsWith(pendingRendered,StringComparison.Ordinal))
                            pendingFound=true;
                    }
                }
                if(!String.IsNullOrEmpty(pendingRendered) && !pendingFound)
                    messages.Items.Add(pendingRendered);
                if(messages.Items.Count>0)messages.TopIndex=messages.Items.Count-1;
            });
        });
    }

    void SendMessage
'@
          $text = [regex]::Replace($text,$loadPattern,$loadReplacement,1)

          $sendPattern = '(?s)    void SendMessage\(\)\s*\{.*?\n    \}\n\n    string ExtractChatValue'
          $sendReplacement = @'
    void SendMessage()
    {
        string msg=input.Text.Trim();
        if(msg.Length==0||busy)return;
        if(msg.Length>300)msg=msg.Substring(0,300);

        string safe=msg.Replace("\\","\\\\").Replace("\"","\\\"").Replace("\r"," ").Replace("\n"," ");
        string safeName=displayName.Replace("\\","\\\\").Replace("\"","\\\"").Replace("\r"," ").Replace("\n"," ");
        string rendered=DateTime.Now.ToString("HH:mm:ss")+"  "+displayName+": "+msg;

        // Local-first: the sender sees the message immediately.
        input.Clear();
        messages.Items.Add(rendered);
        if(messages.Items.Count>0)messages.TopIndex=messages.Items.Count-1;
        pendingMessage=msg;
        pendingRendered=rendered;

        string payload="{\"action\":\"chatSend\",\"userId\":\""+safeName+"\",\"message\":\""+safe+"\"}";
        busy=true;
        send.Enabled=false;
        ThreadPool.QueueUserWorkItem(delegate
        {
            bool sent=false;
            string error="";
            try
            {
                ServicePointManager.SecurityProtocol=SecurityProtocolType.Tls12;
                using(WebClient wc=new WebClient())
                {
                    wc.Headers[HttpRequestHeader.UserAgent]="TypingWatch/"+Environment.Version.ToString();
                    wc.Headers[HttpRequestHeader.ContentType]="application/json; charset=utf-8";
                    wc.CachePolicy=new System.Net.Cache.RequestCachePolicy(System.Net.Cache.RequestCacheLevel.NoCacheNoStore);
                    string response=wc.UploadString(serverUrl,"POST",payload);
                    sent=response.IndexOf("\"ok\":true",StringComparison.OrdinalIgnoreCase)>=0||
                         response.IndexOf("\"success\":true",StringComparison.OrdinalIgnoreCase)>=0;
                    if(!sent)error=response;
                }
            }
            catch(Exception ex){ error=ex.Message; }
            BeginInvoke((MethodInvoker)delegate
            {
                busy=false;
                send.Enabled=true;
                if(sent)
                {
                    pendingMessage="";
                    pendingRendered="";
                    Text="TYPING WATCH - Live Chat";
                    LoadMessages();
                }
                else
                {
                    Text="TYPING WATCH - Live Chat (message pending sync)";
                    if(!String.IsNullOrEmpty(error))
                        MessageBox.Show("Message server par save nahi hua.\r\n\r\n"+error,"Live Chat",MessageBoxButtons.OK,MessageBoxIcon.Warning);
                }
            });
        });
    }

    string ExtractChatValue
'@
          $text = [regex]::Replace($text,$sendPattern,$sendReplacement,1)

          [System.IO.File]::WriteAllText($source,$text,$utf8)
          [System.IO.File]::WriteAllText($build,$text,$utf8)

          # Keep the Apps Script source aligned with the customer EXE version.
          if (Test-Path $backend) {
            $b = [System.IO.File]::ReadAllText($backend,$utf8)
            $b = $b.Replace("AppVersion: '1.0.3'", "AppVersion: '1.0.13'")
            $b = $b.Replace("const version=c.AppVersion || '1.0.3';", "const version=c.AppVersion || '1.0.13';")
            [System.IO.File]::WriteAllText($backend,$b,$utf8)
          }

          [System.IO.File]::WriteAllText((Join-Path $env:GITHUB_WORKSPACE 'version.json'),'{"tag_name":"1.0.13"}',$utf8)

      - name: Compile x86 Windows Forms EXE
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework\v4.0.30319\csc.exe'
          if (-not (Test-Path $csc)) { throw 'C# compiler was not found.' }
          & $csc /nologo /target:winexe /platform:x86 /optimize+ /out:TypingWatch.exe /reference:System.dll /reference:System.Core.dll /reference:System.Drawing.dll /reference:System.Windows.Forms.dll TypingWatch_Build.cs
          if ($LASTEXITCODE -ne 0) { throw 'C# compilation failed.' }
          if (-not (Test-Path 'TypingWatch.exe')) { throw 'TypingWatch.exe was not created.' }
          if ((Get-Item 'TypingWatch.exe').Length -lt 30000) { throw 'Built EXE is unexpectedly small.' }

      - name: Startup smoke test
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $p = Start-Process -FilePath (Join-Path $env:GITHUB_WORKSPACE 'TypingWatch.exe') -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "TypingWatch exited during startup test. ExitCode=$($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: TypingWatch-Windows-EXE-1.0.13-fixed
          path: TypingWatch.exe
          if-no-files-found: error

      - name: Commit rebuilt EXE and permanent source fixes
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add TypingWatch.exe src\TypingWatch_Complete_Online.cs backend\Code.gs version.json
          if (-not (git diff --cached --quiet)) {
            git commit -m "Fix Live Chat local-first send and sync [skip ci]"
            git pull --rebase origin $env:GITHUB_REF_NAME
            git push origin HEAD:$env:GITHUB_REF_NAME
          }
