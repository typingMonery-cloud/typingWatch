name: Package Typing Watch EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'TypingWatch.exe'
      - '.github/workflows/build-typingwatch.yml'

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare the uploaded working EXE
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'TypingWatch.exe'
          $outDir = Join-Path $env:GITHUB_WORKSPACE 'dist'
          if (-not (Test-Path $source)) { throw 'Repository root TypingWatch.exe was not found.' }
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          Copy-Item -LiteralPath $source -Destination (Join-Path $outDir 'TypingWatch.exe') -Force
          if ((Get-Item (Join-Path $outDir 'TypingWatch.exe')).Length -le 0) { throw 'Copied EXE is empty.' }

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: TypingWatch-Windows-EXE
          path: dist/TypingWatch.exe
          if-no-files-found: error
