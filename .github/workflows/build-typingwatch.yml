name: Package Typing Watch EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'TypingWatch.exe'
      - 'src/TypingWatch_Complete_Online.cs'
      - '.github/workflows/build-typingwatch.yml'
      - 'version.json'

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build stable online-sync EXE
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'src\TypingWatch_Complete_Online.cs'
          $patched = Join-Path $env:GITHUB_WORKSPACE 'src\TypingWatch_Complete_Online_Build.cs'
          if (-not (Test-Path $source)) { throw 'Source C# file was not found.' }

          $text = Get-Content -LiteralPath $source -Raw

          $text = $text.Replace('const string AppVersion = "1.0.0";', 'const string AppVersion = "1.0.3";')
          $text = $text.Replace('const string AppVersion = "1.0.2";', 'const string AppVersion = "1.0.3";')
          $text = $text.Replace('if(DateTime.Now>=nextOnlineSync) { nextOnlineSync=DateTime.Now.AddSeconds(30); SyncOnlineNow(); }', 'if(DateTime.Now>=nextOnlineSync) { nextOnlineSync=DateTime.Now.AddSeconds(5); SyncOnlineNow(); }')
          $text = $text.Replace('nextOnlineSync=DateTime.Now.AddSeconds(30);', 'nextOnlineSync=DateTime.Now.AddSeconds(5);')

          # FIX: disable the obsolete placeholder guard. The real repository
          # is already configured by UpdateOwner and UpdateRepository.
          $text = [regex]::Replace($text, 'if\(UpdateOwner==\s*"YOUR-GITHUB-USERNAME"\)', 'if(false)', 1)
          if ($text -match 'if\(UpdateOwner==\s*"YOUR-GITHUB-USERNAME"\)') {
            throw 'The obsolete GitHub placeholder guard is still present.'
          }

          $newPayload = '                    string payload="{\"action\":\"heartbeat\",\"userId\":\""+onlineUserId+"\",\"typing\":\""+(typing?"true":"false")+"\",\"language\":\""+language+"\",\"wpm\":"+((int)Math.Round(displayedWpm))+",\"version\":\""+AppVersion+"\"}";'
          $text = [regex]::Replace($text, '(?m)^\s*string payload=.*heartbeat.*$', $newPayload)
          $text = $text.Replace('https://api.github.com/repos/'+"typingMonery-cloud"+'/'+"typingWatch"+'/releases/latest', 'https://raw.githubusercontent.com/typingMonery-cloud/typingWatch/main/version.json')
          $text = $text.Replace('        Application.Run(new TypingWatch());', '        Application.SetUnhandledExceptionMode(UnhandledExceptionMode.CatchException); Application.ThreadException += delegate(object s, ThreadExceptionEventArgs e) { try { File.AppendAllText(Path.Combine(Environment.GetFolderPath(Environment.SpecialFolder.ApplicationData), "TypingWatch", "errors.log"), DateTime.Now.ToString("o")+" | UI | "+e.Exception+Environment.NewLine); } catch { } }; Application.Run(new TypingWatch());')
          $text = $text.Replace('        if(now.Second%5==0) SaveData();', '        if(now.Second%5==0) { try { SaveData(); } catch { } }')

          # Save the fixed source back to the repository workspace so the
          # repository source and the built EXE stay in sync.
          Set-Content -LiteralPath $source -Value $text -Encoding UTF8
          Set-Content -LiteralPath $patched -Value $text -Encoding UTF8

          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path $csc)) { $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework\v4.0.30319\csc.exe' }
          if (-not (Test-Path $csc)) { throw 'C# compiler was not found.' }
          & $csc /nologo /target:winexe /out:TypingWatch.exe /reference:System.dll /reference:System.Core.dll /reference:System.Drawing.dll /reference:System.Windows.Forms.dll $patched
          if ($LASTEXITCODE -ne 0) { throw 'C# compilation failed.' }
          if (-not (Test-Path 'TypingWatch.exe')) { throw 'TypingWatch.exe was not created.' }
          if ((Get-Item 'TypingWatch.exe').Length -le 0) { throw 'Built EXE is empty.' }

      - name: Prepare artifact
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $outDir = Join-Path $env:GITHUB_WORKSPACE 'dist'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'TypingWatch.exe') -Destination (Join-Path $outDir 'TypingWatch.exe') -Force

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: TypingWatch-Windows-EXE
          path: dist/TypingWatch.exe
          if-no-files-found: error

      - name: Commit fixed source and EXE
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/TypingWatch_Complete_Online.cs TypingWatch.exe
          if (-not (git diff --cached --quiet)) {
            git commit -m "Fix GitHub auto-update in TypingWatch [skip ci]"
            git push
          }
