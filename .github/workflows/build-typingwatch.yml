name: Package Typing Watch EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'TypingWatch.exe'
      - 'src/TypingWatch_Complete_Online.cs'
      - '.github/workflows/build-typingwatch.yml'
      - 'version.json'

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch source for fixed release
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'src\TypingWatch_Complete_Online.cs'
          $build = Join-Path $env:GITHUB_WORKSPACE 'TypingWatch_Build.cs'
          if (-not (Test-Path $source)) { throw 'Source C# file was not found.' }
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          $text = [System.IO.File]::ReadAllText($source,$utf8)

          # Permanent target: 100 hours.
          $text = $text.Replace('TimeSpan.FromHours(50)','TimeSpan.FromHours(100)')
          $text = $text.Replace('Remaining (50h):','Remaining (100h):')

          # Remove broken UTF-8/ANSI label text from the UI.
          $text = $text.Replace('âš™ Settings Dashboard','Settings Dashboard')
          $text = $text.Replace('ðŸ’¬ Live Chat','Live Chat')
          $text = $text.Replace('â†» Check for Updates','Check for Updates')

          $text = $text.Replace('const string AppVersion = "1.0.10";','const string AppVersion = "1.0.11";')
          $text = $text.Replace('onlineUsersLabel.Visible=false;','onlineUsersLabel.Visible=true;')

          $old = 'string api="https://raw.githubusercontent.com/"+UpdateOwner+"/"+UpdateRepository+"/main/version.json";'
          $new = 'string api=OnlineServerUrl+"?action=config&_="+DateTime.UtcNow.Ticks;'
          $text = $text.Replace($old,$new)

          $oldDownload = 'string url="https://raw.githubusercontent.com/"+UpdateOwner+"/"+UpdateRepository+"/main/TypingWatch.exe";'
          $newDownload = 'string url="https://github.com/"+UpdateOwner+"/"+UpdateRepository+"/raw/refs/heads/main/TypingWatch.exe";'
          $text = $text.Replace($oldDownload,$newDownload)

          $startupPattern = 'BeginInvoke\(\(MethodInvoker\)delegate\s*\{\s*StartOnlineSync\(\);\s*CheckForUpdates\(false\);\s*\}\);'
          $startupReplacement = 'Shown+=(s,e)=>{ StartOnlineSync(); CheckForUpdates(false); };'
          $text = [regex]::Replace($text,$startupPattern,$startupReplacement,1)

          # Keep the permanent source file in sync with the built EXE.
          [System.IO.File]::WriteAllText($source,$text,$utf8)
          [System.IO.File]::WriteAllText($build,$text,$utf8)

      - name: Compile x86 Windows Forms EXE
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework\v4.0.30319\csc.exe'
          if (-not (Test-Path $csc)) { throw 'C# compiler was not found.' }
          & $csc /nologo /target:winexe /platform:x86 /optimize+ /out:TypingWatch.exe /reference:System.dll /reference:System.Core.dll /reference:System.Drawing.dll /reference:System.Windows.Forms.dll TypingWatch_Build.cs
          if ($LASTEXITCODE -ne 0) { throw 'C# compilation failed.' }
          if (-not (Test-Path 'TypingWatch.exe')) { throw 'TypingWatch.exe was not created.' }
          if ((Get-Item 'TypingWatch.exe').Length -lt 30000) { throw 'Built EXE is unexpectedly small.' }

      - name: Startup smoke test
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $p = Start-Process -FilePath (Join-Path $env:GITHUB_WORKSPACE 'TypingWatch.exe') -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "TypingWatch exited during startup test. ExitCode=$($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: TypingWatch-Windows-EXE-1.0.11-fixed
          path: TypingWatch.exe
          if-no-files-found: error

      - name: Commit rebuilt EXE and permanent source fixes
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TypingWatch.exe src\TypingWatch_Complete_Online.cs
          if (-not (git diff --cached --quiet)) {
            git commit -m "Build Typing Watch 1.0.11 with permanent 100-hour target and clean labels [skip ci]"
            git pull --rebase origin $env:GITHUB_REF_NAME
            git push origin HEAD:$env:GITHUB_REF_NAME
          }
