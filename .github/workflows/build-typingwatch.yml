name: Package Typing Watch EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'TypingWatch.exe'
      - 'src/TypingWatch_Complete_Online.cs'
      - '.github/workflows/build-typingwatch.yml'
      - 'version.json'

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare source for version 1.0.8
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'src\TypingWatch_Complete_Online.cs'
          if (-not (Test-Path $source)) { throw 'Source C# file was not found.' }
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          $text = [System.IO.File]::ReadAllText($source, $utf8)
          $text = $text.Replace('const string AppVersion = "1.0.0";', 'const string AppVersion = "1.0.8";')
          $text = $text.Replace('const string AppVersion = "1.0.2";', 'const string AppVersion = "1.0.8";')
          $text = $text.Replace('const string AppVersion = "1.0.3";', 'const string AppVersion = "1.0.8";')
          $text = $text.Replace('const string AppVersion = "1.0.4";', 'const string AppVersion = "1.0.8";')
          [System.IO.File]::WriteAllText($source, $text, $utf8)

      - name: Compile x86 Windows Forms EXE
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework\v4.0.30319\csc.exe'
          if (-not (Test-Path $csc)) { throw 'C# compiler was not found.' }
          & $csc /nologo /target:winexe /platform:x86 /optimize+ /out:TypingWatch.exe /reference:System.dll /reference:System.Core.dll /reference:System.Drawing.dll /reference:System.Windows.Forms.dll src\TypingWatch_Complete_Online.cs
          if ($LASTEXITCODE -ne 0) { throw 'C# compilation failed.' }
          if (-not (Test-Path 'TypingWatch.exe')) { throw 'TypingWatch.exe was not created.' }
          if ((Get-Item 'TypingWatch.exe').Length -le 0) { throw 'Built EXE is empty.' }

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: TypingWatch-Windows-EXE-1.0.8
          path: TypingWatch.exe
          if-no-files-found: error

      - name: Commit rebuilt EXE
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TypingWatch.exe
          if (-not (git diff --cached --quiet)) {
            git commit -m "Build Typing Watch 1.0.8 [skip ci]"
            git push
          }
