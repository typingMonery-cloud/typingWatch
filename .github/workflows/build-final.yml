name: Build TypingWatch Final EXE

on:
  push:
    paths:
      - 'src/TypingWatch_Complete_Online.cs'
      - '.github/workflows/build-final.yml'
      - 'build/StableLiveChatForm.cs'
      - 'index.html'
  workflow_dispatch:

concurrency:
  group: typingwatch-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read app version and apply stable Live Chat patch
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'src\TypingWatch_Complete_Online.cs'
          $src = Get-Content $path -Raw
          $match = [regex]::Match($src, 'AppVersion\s*=\s*"([^"]+)"')
          if (-not $match.Success) { throw 'AppVersion not found in source.' }
          $version = $match.Groups[1].Value
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $start = $src.IndexOf('class LiveChatForm : Form')
          $end = $src.IndexOf('class SettingsDashboardForm : Form')
          if ($start -lt 0 -or $end -lt 0 -or $end -le $start) { throw 'LiveChatForm boundaries not found.' }
          $chat = Get-Content 'build\StableLiveChatForm.cs' -Raw
          $src = $src.Substring(0,$start) + $chat + $src.Substring($end)
          Set-Content -Path $path -Value $src -Encoding UTF8
          Write-Host "Building TypingWatch $version"

      - name: Compile x86 EXE
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework\v4.0.30319\csc.exe'
          if (-not (Test-Path $csc)) { throw 'C# compiler not found.' }
          & $csc /nologo /target:winexe /platform:x86 /optimize+ /out:TypingWatch.exe /reference:System.dll /reference:System.Core.dll /reference:System.Drawing.dll /reference:System.Windows.Forms.dll src\TypingWatch_Complete_Online.cs
          if ($LASTEXITCODE -ne 0) { throw 'C# compilation failed.' }
          if (-not (Test-Path 'TypingWatch.exe')) { throw 'EXE was not created.' }
          $size=(Get-Item 'TypingWatch.exe').Length
          if ($size -lt 30000) { throw "EXE is unexpectedly small: $size bytes" }
          Write-Host "Built TypingWatch.exe: $size bytes"

      - name: Startup smoke test
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $p = Start-Process -FilePath (Join-Path $env:GITHUB_WORKSPACE 'TypingWatch.exe') -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "TypingWatch exited during startup test. ExitCode=$($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Write-Host 'Startup smoke test passed.'

      - name: Upload final EXE
        uses: actions/upload-artifact@v4
        with:
          name: TypingWatch-Windows-x86-${{ env.APP_VERSION }}
          path: TypingWatch.exe
          if-no-files-found: error

      - name: Publish EXE to main branch
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TypingWatch.exe
          if (-not (git diff --cached --quiet)) {
            git commit -m "Publish TypingWatch EXE ${{ env.APP_VERSION }} [skip ci]"
            git fetch origin $env:GITHUB_REF_NAME
            git rebase origin/$env:GITHUB_REF_NAME
            git push origin HEAD:$env:GITHUB_REF_NAME
          }
